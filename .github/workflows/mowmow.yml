name: Generate MowMow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout MowMow generator
        uses: actions/checkout@v4
        with:
          repository: UlongChaS2/mowmow
          ref: main
          path: .mowmow

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .mowmow/package-lock.json

      - name: Install MowMow dependencies
        run: npm ci
        working-directory: .mowmow

      - name: Generate MowMow
        run: |
          npm run generate:svg -- \
            --username "${{ github.repository_owner }}" \
            --output "$GITHUB_WORKSPACE/dist/mowmow.svg" \
            --traversal random \
            --rows 7 \
            --columns 53
        working-directory: .mowmow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove generator checkout
        run: rm -rf .mowmow

      - name: Commit generated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update mowmow"
          file_pattern: dist/mowmow.svg
